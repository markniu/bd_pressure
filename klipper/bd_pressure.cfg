
[bdpressure bd_pa]
##   usb example 
# port:usb
# serial:auto  # serial:/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
# #serial:/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0  ## uncomment this if you only have bd_pressure an no bd_width device
# #serial:/dev/serial/by-path/ReplaceWithYourDevicePath  # You need to use ls /dev/serial/by-path , and determine which entry belongs to bd_pressure. if yu change the port it's plugged into, you will need to adjust this after doing so to reflect the new usb port you moved it to. 
# baud:38400

##   i2c example
port:i2c
i2c_mcu: MKS_THR
i2c_software_scl_pin:MKS_THR:PB3
i2c_software_sda_pin:MKS_THR:PB4
thrhold:3


  
[probe]
pin: ^MKS_THR:PB7
x_offset: 0
y_offset: 0
z_offset: -0.08
speed: 3
lift_speed:3
samples: 2
samples_result: median
sample_retract_dist: 5
samples_tolerance: 0.03
samples_tolerance_retries: 5
activate_gcode: 
   PA_RESET
   PA_RESET
   PA_RESET

[gcode_macro PA_RESET]
gcode:
     M400
     #G4 P200
     SET_BDPRESSURE NAME=bd_pa COMMAND=RESET_PROBE
     #G4 P200


[gcode_macro PA_STATE]
gcode:
    {% set status = printer["bdpressure bd_pa"].state %} 
    { action_respond_info("status:%s %d"%(status,params.T|int)) }


[gcode_macro PA_E]
gcode:
    # Per-step pass called by PA_CALIBRATE. All coordinates/extrusion amounts are
    # passed as params so they fit the machine build volume and the current
    # nozzle/flow scaling.
    {% set status = printer["bdpressure bd_pa"].state %}
    {% set i = params.I|int %}
    {% if status=='START' %}
        {% set pressure_ad = 0 + i*(params.STEP|float) %}
        SET_PRESSURE_ADVANCE ADVANCE={pressure_ad}
        {% set y_step = params.Y_START|float + (i*params.Y_STEP|float) %}
        G1 X{params.X_START|float} Y{y_step} F{params.T_SPEED|int}
        G1 F{params.L_SPEED|int}
        G1 X{params.X_MID1|float} Y{y_step} E{params.E_ACC|float}
        G1 F{params.H_SPEED|int}
        G1 X{params.X_MID2|float} Y{y_step} E{params.E_CRUISE|float}
        G1 F{params.L_SPEED|int}
        G1 X{params.X_END|float} Y{y_step} E{params.E_DEC|float}
        M400
        SET_BDPRESSURE NAME=bd_pa COMMAND=READ VALUE={pressure_ad}
    {% endif %}
    

[gcode_macro PA_CALIBRATE]
gcode:
    # PA_CALIBRATE NOZZLE_TEMP=[first_layer_temperature] MAX_VOLUMETRIC=[filament_max_volumetric_speed] ACC_WALL=[outer_wall_acceleration]
    # TRAVEL_SPEED=[travel_speed]  ACC_TO_DECEL_FACTOR=[accel_to_decel_factor]
    # NOZZLE=[nozzle_diameter] FLOW=[filament_flow_ratio]  # OrcaSlicer flow ratio
    # PrusaSlicer: FLOW=[extrusion_multiplier]  (Orca key = filament_flow_ratio)
    # optional: X_MARGIN=5 Y_MARGIN=5 Y_STEP=3.5 PASSES=50

    ### temperature=210,ACCEL_TO_DECEL=10000,ACCEL=8000,SQUARE_CORNER_VELOCITY=5
    {% set NOZZLE_TEMP = 210 %}
    {% if params.NOZZLE_TEMP %}
	      { action_respond_info("nozzle TEMPERATURE %s "%params.NOZZLE_TEMP) }
	      {% set NOZZLE_TEMP = params.NOZZLE_TEMP|default(210)|float %}
	  {% endif %}
    {% set ACC_WALL = 4000 %}
    {% if params.ACC_WALL %}
	      { action_respond_info("ACC_out_WALL %s "%params.ACC_WALL) }
	      {% set ACC_WALL = params.ACC_WALL|default(4000)|float %}
	  {% endif %}

    {% set SQUARE_CORNER_SPEED = 9 %}
    {% if params.SQUARE_CORNER_VELOCITY %}
	      { action_respond_info("SQUARE_CORNER_VELOCITY %s "%params.SQUARE_CORNER_VELOCITY) }
	      {% set SQUARE_CORNER_SPEED = params.SQUARE_CORNER_VELOCITY|default(9)|float %}
	  {% endif %}
    # =====================================================================
    # nozzle & flow scaling:
    #   The E values were reverse-engineered from OrcaSlicer for a 0.4mm
    #   nozzle at 100% flow (line cross-section ~0.1114 mm^2). For other
    #   nozzle diameters and/or slicer flow ratios the extrusion must be
    #   scaled:  E = E_ref * (NOZZLE/0.4)^2 * FLOW
    # =====================================================================
    {% set NOZZLE = params.NOZZLE|default(0.4)|float %}
    {% set FLOW   = params.FLOW|default(1.0)|float %}
    {% if NOZZLE <= 0 or FLOW <= 0 %}
        { action_raise_error("bd_pressure: NOZZLE and FLOW must be > 0") }
    {% endif %}
    {% set E_SCALE = (NOZZLE/0.4)**2 * FLOW %}
    { action_respond_info("nozzle %.2fmm flow %.3f E_scale %.3f"%(NOZZLE,FLOW,E_SCALE)) }

    # =====================================================================
    # machine travel: only the START point is shifted to the smallest valid
    # coordinates (x_min/y_min + margin). The movement DISTANCES are unchanged:
    # line = 20/40/20 mm (80 mm total), Y step = 3.5 mm x 50 passes.
    # =====================================================================
    {% set x_min = printer.toolhead.axis_minimum[0] %}
    {% set x_max = printer.toolhead.axis_maximum[0] %}
    {% set y_min = printer.toolhead.axis_minimum[1] %}
    {% set y_max = printer.toolhead.axis_maximum[1] %}
    {% set X_MARGIN = params.X_MARGIN|default(5)|float %}
    {% set Y_MARGIN = params.Y_MARGIN|default(5)|float %}
    {% set X_START = x_min + X_MARGIN %}
    {% set Y_START = y_min + Y_MARGIN %}

    # fixed line segments (unchanged): acc 20 / cruise 40 / dec 20 mm
    {% set L_ACC = 20.0 %}
    {% set L_CRUISE = 40.0 %}
    {% set L_DEC = 20.0 %}
    {% set X_MID1 = X_START + L_ACC %}
    {% set X_MID2 = X_MID1 + L_CRUISE %}
    {% set X_END  = X_MID2 + L_DEC %}
    {% if X_END > x_max %}
        { action_raise_error("bd_pressure: fixed 80mm line (X %.1f->%.1f) exceeds X max %.1f - machine too small"%(X_START, X_END, x_max)) }
    {% endif %}

    # fixed Y layout (unchanged): 3.5 mm step x 50 passes
    {% set Y_STEP  = params.Y_STEP|default(3.5)|float %}
    {% set PASSES  = params.PASSES|default(50)|int %}
    {% set Y_END = Y_START + (PASSES-1)*Y_STEP %}
    {% if Y_END > y_max %}
        { action_raise_error("bd_pressure: Y layout (%.1f->%.1f, step %.2f x %d) exceeds Y max %.1f - reduce PASSES or Y_STEP"%(Y_START, Y_END, Y_STEP, PASSES, y_max)) }
    {% endif %}
    { action_respond_info("line X %.1f->%.1f | Y %.1f->%.1f step %.2f passes %d"%(X_START,X_END,Y_START,Y_END,Y_STEP,PASSES)) }

    # scaled extrusion amounts (nozzle/flow only - line lengths unchanged)
    {% set E_PURGE  = 9.92204*E_SCALE %}
    {% set E_ACC    = 0.92643*E_SCALE %}
    {% set E_CRUISE = 1.85285*E_SCALE %}
    {% set E_DEC    = 0.92643*E_SCALE %}

    ### travel_speed=400, max_volumetric_speed = [filament_max_volumetric_speed]
    ##  low_speed = (1020/20)*max_volumetric_speed
    ##  high_speed = (10740/20)*max_volumetric_speed
    {% set ACC_TO_DECEL_FAC = 0.5 %}
    {% set MIN_CRUISE = 0.5 %}
    {% if params.ACC_TO_DECEL_FACTOR %}
	      { action_respond_info("accel_to_decel_factor %s "%params.ACC_TO_DECEL_FACTOR) }
	      {% set ACC_TO_DECEL_FAC =  params.ACC_TO_DECEL_FACTOR.replace("%", "").strip() | float / 100    %}
	      {% set MIN_CRUISE = 1-ACC_TO_DECEL_FAC|float %}
          { action_respond_info("ACC_TO_DECEL_FACTOR %s "%ACC_TO_DECEL_FAC) }      
	{% endif %}
    {% if params.MINIMUM_CRUISE_RATIO %}
       {% set MIN_CRUISE = params.MINIMUM_CRUISE_RATIO|default(0.5)|float %}
    {% endif %}
    { action_respond_info("MIN_CRUISE %s "%MIN_CRUISE) }
    {% set ACC_TO_DEC = ACC_TO_DECEL_FAC*ACC_WALL %}
    
    {% set TRAVEL_SPEED = 400 %}
    {% if params.TRAVEL_SPEED %}
	      {% set TRAVEL_SPEED = params.TRAVEL_SPEED|default(400)|float * 60 %}
          { action_respond_info("travel_speed %s/60 "%TRAVEL_SPEED) }
	  {% endif %}
    {% set MAX_VOLUMETRIC = 25 %}
    {% if params.MAX_VOLUMETRIC %}
	      { action_respond_info("filament_max_volumetric_speed %s "%params.MAX_VOLUMETRIC) }
	      {% set MAX_VOLUMETRIC = params.MAX_VOLUMETRIC|default(25)|float %}
	  {% endif %}
    {% set low_speed = 51*MAX_VOLUMETRIC %}
    { action_respond_info("low_speed %f "%low_speed) }
    {% set high_speed = 537*MAX_VOLUMETRIC %}
    { action_respond_info("high_speed %f "%high_speed) }
    
    #  volum=[filament_max_volumetric_speed]
    #  travel=[travel_speed] [accel_to_decel_factor] acc=[outer_wall_acceleration] temper=[first_layer_temperature]
    #SET_KINEMATIC_POSITION Z={z_current}
    {% set z_current=printer.toolhead.position.z %}
    G90
    G21
    M83
    M109 S{NOZZLE_TEMP}
    G1 E4
    SET_PRESSURE_ADVANCE ADVANCE=0.04; Override pressure advance value
    SET_VELOCITY_LIMIT ACCEL={ACC_WALL} ACCEL_TO_DECEL={ACC_TO_DEC}
    SET_VELOCITY_LIMIT ACCEL={ACC_WALL} MINIMUM_CRUISE_RATIO={MIN_CRUISE}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={SQUARE_CORNER_SPEED}
    
    
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=1
    SET_BDPRESSURE NAME=bd_pa COMMAND=START
    M400
    G4 P1000
    {% set pressure_ad = 0 %}
    {% set pressure_step = 0.002 %}
    
    # prime the nozzle in place at a controlled speed (the old travel-prime
    # extruded the purge far too fast on small machines)
    G1 F{low_speed}
    G1 E{'%.5f' % E_PURGE}
    M400
    G4 P4000
    # travel to the start of the calibration lines
    G1 X{X_START} Y{Y_START} F{TRAVEL_SPEED}
    M400
    G4 P1000
    # first calibration line
    G1 F{low_speed}
    G1 X{X_MID1} Y{Y_START} E{'%.5f' % E_ACC}
    G1 X{X_MID2} Y{Y_START} E{'%.5f' % E_CRUISE}
    G1 X{X_END} Y{Y_START} E{'%.5f' % E_DEC}
    G1 X{X_START} Y{Y_START} F{TRAVEL_SPEED}
    ######
    M400
    {% for i in range(PASSES) %}
       PA_E STEP={pressure_step} T_SPEED={TRAVEL_SPEED} H_SPEED={high_speed} L_SPEED={low_speed} I={i} X_START={X_START} X_MID1={X_MID1} X_MID2={X_MID2} X_END={X_END} Y_START={Y_START} Y_STEP={Y_STEP} E_ACC={'%.5f' % E_ACC} E_CRUISE={'%.5f' % E_CRUISE} E_DEC={'%.5f' % E_DEC}
    {% endfor %}
    M400
    SET_BDPRESSURE NAME=bd_pa COMMAND=STOP
    G4 P500
    SET_BDPRESSURE NAME=bd_pa COMMAND=RESET_PROBE
    G4 P500
    SET_KINEMATIC_POSITION X=0 Y=0
    G28 X
    G28 Y
    SET_KINEMATIC_POSITION Z={z_current}
    G4 P200
    
    
    #G28 Z

    
    
